containers:
  - class: QList
    type: Sequential
    instantiations:
      - [ "qreal" ]
      - [ "QByteArray" ] # As Bytes, see types.yml
      - [ "QFileInfo" ] # QFileInfoList, of QDir#entryInfoList
      - [ "QModelIndex" ] # QModelIndexList, of QItemSelectionModel#selectedIndexes
      - [ "QCommandLineOption" ] # QCommandLineParser#addOptions
      - [ "QMimeType" ] # QMimeDatabase#mimeTypesForFileName
      - [ "QInputMethodEvent::Attribute" ] # QInputMethodEvent#attributes
  - class: QVector
    type: Sequential
    instantiations:
      - [ "QRgb" ]
      - [ "int" ] # QVersionNumber#segments
      - [ "QTimeZone::OffsetData" ] # QTimeZone::OffsetDataList
  # Qt 5's QPair is a class template of its own, converted to and from a Tuple.
  # The pairs nested in other containers, like the `QList<QPair<QString,
  # QString>>` of QUrlQuery#queryItems or `QVariantAnimation::KeyValues`, are
  # found with them.  Don't list them here or above: the containers nested in
  # an explicit instantiation aren't instantiated, and one written with a
  # typedef, like `QPair<qreal, QVariant>`, differs from the canonical
  # `QPair<double, QVariant>` the methods are found to use.
  - class: QPair
    type: Pair
  # The maps the methods use are instantiated automatically too, exchanged as
  # a Hash: StandardItemModel#item_data is a Hash(Int32, Variant),
  # AbstractItemModel#role_names a Hash(Int32, Bytes).
  - class: QMap
    type: Associative
    count_method: contains
    erase_method: remove
    insert_method: insert
  # QSet<T> is an Enumerable(T) with includes?, add/<<, delete and concat; the
  # sets the methods use are instantiated automatically, and a method taking
  # one accepts any Enumerable.
  - class: QSet
    type: Set
    count_method: contains
    erase_method: remove
    instantiations:
      - [ "QString" ] # No wrapped Qt 5 method uses a QSet, so these are explicit
      - [ "int" ]
  - class: QHash
    type: Associative
    count_method: contains
    erase_method: remove
    insert_method: insert
