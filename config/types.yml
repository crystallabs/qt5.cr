types: # Type rewrite rules
  QString: # Convert QString instances using that:
    converter: Qt::Converter::QString
    crystal_type: String
    cpp_type: CrystalString
    binding_type: CrystalString
    to_cpp: "QString::fromUtf8(%.ptr, %.size)"
    from_cpp: "qstring_to_crystal(%)"
    kind: Struct
    builtin: true
    pass_by: Value
    wrapper_pass_by: Value
  QByteArray: # Map as Bytes, exchanged as a {pointer, size} pair like QString
    converter: Qt::Converter::QByteArray
    crystal_type: Bytes
    cpp_type: CrystalString
    binding_type: CrystalString
    to_cpp: "QByteArray(%.ptr, %.size)"
    from_cpp: "qbytearray_to_crystal(%)"
    kind: Struct
    builtin: true
    pass_by: Value
    wrapper_pass_by: Value
  QChar: # Map as Crystal Char
    cpp_type: int32_t
    binding_type: Int32
    builtin: true
    crystal_type: Char
    to_cpp: "QChar(%)"
    from_cpp: "static_cast<int32_t>(%.unicode())"
    to_crystal: "(%.chr)"
    from_crystal: "(%.ord)"
    kind: Struct
    pass_by: Value
  QVariant:
    crystal_type: Variant
    binding_type: CrystalVariant
    cpp_type: CrystalVariant
    from_crystal: "(%.to_unsafe)"
    to_crystal: "Qt::Variant.new(%)"
    from_cpp: "qvariant_to_crystal(%)"
    to_cpp: "crystal_to_qvariant(%)"
    kind: Struct
    builtin: true
    pass_by: Value
    wrapper_pass_by: Value
    generate_wrapper: false
    generate_binding: false
  QVariant::DataPtr: { ignore: true }
  "QUrlQuery::DataPtr": { ignore: true } # A QSharedDataPointer
  "QMetaObject::Connection":
    crystal_type: SignalConnection
    cpp_type: "QMetaObject::Connection"
    binding_type: QMetaObjectConnection
  QSessionManager:
    pass_by: Reference
    from_cpp: "(%)"
  QPoint:
    copy_structure: true
    binding_type: QPoint
    generate_binding: true
    generate_wrapper: true
    pass_by: Value
    kind: Struct
  QPointF:
    copy_structure: true
    binding_type: QPointF
    generate_binding: true
    generate_wrapper: true
    crystal_type: PointF
    pass_by: Value
    kind: Struct
  QSize:
    copy_structure: true
    binding_type: QSize
    generate_binding: true
    generate_wrapper: true
    crystal_type: Size
    pass_by: Value
    kind: Struct
    ignore_methods:
      - toCGSize
  QSizeF:
    copy_structure: true
    binding_type: QSizeF
    generate_binding: true
    generate_wrapper: true
    crystal_type: SizeF
    pass_by: Value
    kind: Struct
  QLine:
    copy_structure: true
    binding_type: QLine
    generate_binding: true
    generate_wrapper: true
    crystal_type: Line
    pass_by: Value
    kind: Struct
  QLineF:
    copy_structure: true
    binding_type: QLineF
    generate_binding: true
    generate_wrapper: true
    crystal_type: LineF
    pass_by: Value
    kind: Struct
  QRect:
    copy_structure: true
    binding_type: QRect
    generate_binding: true
    generate_wrapper: true
    crystal_type: Rect
    pass_by: Value
    kind: Struct
  QRectF:
    copy_structure: true
    binding_type: QRectF
    generate_binding: true
    generate_wrapper: true
    crystal_type: RectF
    pass_by: Value
    kind: Struct

  "QUrl::FormattingOptions":
    crystal_type: Url::FormattingOptions
    binding_type: Url::FormattingOptions
    kind: Enum
    builtin: true # We provide this type

  # Don't sub-class these
  QImage: { sub_class: false }
  QPixmap: { sub_class: false }
  QIcon: { sub_class: false }

  # Typedefs
  QRgb: { alias_for: "unsigned int" }
  "QRandomGenerator::result_type": { alias_for: "unsigned int" } # quint32
  "QRandomGenerator64::result_type": { alias_for: "unsigned long long" } # quint64
  WId: { alias_for: "unsigned int" }
  QStringList: { alias_for: "QList<QString>" } # A subclass of it, convertible both ways

  # The methods of `QList<QString>` (wrapped as `Qt::StringList`, see
  # `config/classes.yml`) use these: C++ iterators have no use in Crystal, and
  # `QVector<QString>` (of `toVector`) isn't wrapped.
  "QList<QString>::iterator": { ignore: true }
  "QList<QString>::const_iterator": { ignore: true }
  "QList<QString>::reverse_iterator": { ignore: true }
  "QList<QString>::const_reverse_iterator": { ignore: true }
  "QVector<QString>": { ignore: true }
  "QList<QString>":
    ignore_methods:
      - "operator[]" # Unchecked in Qt; `Indexable#[]` raises on a bad index
  # Qt's string views and regular expressions aren't wrapped: their overloads
  # would take opaque pointers nobody can build.  The view ones all have a
  # QString twin.
  QStringView: { ignore: true }
  QStringRef: { ignore: true }
  QLatin1String: { ignore: true }
  QRegExp: { ignore: true } # QRegularExpression is wrapped instead

  # Ignore private data structures
  QObjectPrivate: { ignore: true }
  QKeySequencePrivate: { ignore: true }
  QUrlPrivate: { ignore: true }
  QImageData: { ignore: true }
  QIconPrivate: { ignore: true }
  "QPixmap::DataPtr": { ignore: true }
  "QBrush::DataPtr": { ignore: true }
  QPenPrivate: { ignore: true }
  QFileInfoPrivate: { ignore: true }
  QMimeTypePrivate: { ignore: true }

  # QByteArray maps to Bytes; QList<QByteArray> is instantiated in
  # containers.yml, QSet has no mapping yet.
  "QSet<QByteArray>": { ignore: true }

  "Func1": { ignore: true } # Fake types used in QObject::connect().
  "Func2": { ignore: true }
  "QtPrivate::FunctionPointer<Func1>::Object": { ignore: true }
  "QtPrivate::FunctionPointer<Func2>::Object": { ignore: true }
  "T": { ignore: true }
  "void ()": { ignore: true }
  "void (void *)": { ignore: true }
  # The QTextStream manipulators (Qt::endl etc.) are C function pointers,
  # which bindgen cannot express.
  QTextStreamFunction: { ignore: true }
  "QTextStream &(QTextStream &)": { ignore: true }
  # The QTextStreamManipulator constructors take QTextStream member function
  # pointers; Qt.q_set_field_width and the others make one instead.
  QTSMFI: { ignore: true }
  QTSMFC: { ignore: true }
  # QEasingCurve's custom easing function is a C function pointer; the
  # QVariantAnimation interpolators are too, and go through registerInterpolator.
  "QEasingCurve::EasingFunction": { ignore: true }
  "qreal (qreal)": { ignore: true }
  # QSettings::registerFormat takes the ReadFunc and WriteFunc C function
  # pointers; the INI and native formats need none.
  "QSettings::ReadFunc": { ignore: true }
  "QSettings::WriteFunc": { ignore: true }
  "bool (QIODevice &, SettingsMap &)": { ignore: true }
  "bool (QIODevice &, const SettingsMap &)": { ignore: true }
  "std::__1::function<void (const QString &, const QByteArray &)>":
    ignore: true
  "std::function<void (const QString &, const QByteArray &)>":
    ignore: true
  "std::chrono::milliseconds":
    cpp_type: int64_t
    binding_type: Int64
    crystal_type: "::Time::Span" # Qt::Time shadows Time inside module Qt
    generate_binding: false
    generate_wrapper: false
    pass_by: Value
    builtin: true
    to_cpp: "std::chrono::milliseconds(%)"
    from_cpp: "(%.count())"
    converter: Qt::Converter::TimeSpan
  "std::chrono::nanoseconds": # QDeadlineTimer#remainingTimeAsDuration
    cpp_type: int64_t
    binding_type: Int64
    crystal_type: "::Time::Span"
    generate_binding: false
    generate_wrapper: false
    pass_by: Value
    builtin: true
    to_cpp: "std::chrono::nanoseconds(%)"
    from_cpp: "(%.count())"
    converter: Qt::Converter::TimeSpanNanoseconds
  # The seeding from a std::seed_seq (QRandomGenerator) can't be expressed;
  # seed with an integer instead.  QRandomGenerator::System is the private
  # tag of the constructor behind QRandomGenerator::system().
  "std::seed_seq": { ignore: true }
  "QRandomGenerator::System": { ignore: true }
  CGRect: {ignore: true} # Apple types Qt exposes on macOS
  CGSize: {ignore: true}
  CGPoint: {ignore: true}
  CGImage: {ignore: true}
  NSMenu: {ignore: true}
  CFURLRef: {ignore: true}
  NSURL: {ignore: true}
  CFDateRef: {ignore: true} # QDateTime#toCFDate and friends
  __CFDate: {ignore: true}
  NSDate: {ignore: true}
  CFUUIDRef: {ignore: true} # QUuid#toCFUUID and friends
  __CFUUID: {ignore: true}
  NSUUID: {ignore: true}
  CFTimeZoneRef: {ignore: true} # QTimeZone#toCFTimeZone and friends
  __CFTimeZone: {ignore: true}
  NSTimeZone: {ignore: true}
  FILE: {ignore: true} # C stdio handle of QFile#open and QTextStream
  QListWidgetItem:
    ignore_methods:
      - "operator<"
  QPolygon:
    ignore_methods: # Variadic, which can't be wrapped
      - setPoints
      - putPoints
  # Painting and geometry.  The small value classes are copied structures,
  # passed by value like QPoint.  (Each rule is spelled out: bindgen keeps
  # per-type state in the rule, so a YAML alias would share it.)
  QVector2D:
    copy_structure: true
    generate_binding: true
    generate_wrapper: true
    pass_by: Value
    kind: Struct
  QVector3D:
    copy_structure: true
    generate_binding: true
    generate_wrapper: true
    pass_by: Value
    kind: Struct
  QVector4D:
    copy_structure: true
    generate_binding: true
    generate_wrapper: true
    pass_by: Value
    kind: Struct
  QQuaternion:
    copy_structure: true
    generate_binding: true
    generate_wrapper: true
    pass_by: Value
    kind: Struct
  QRgba64:
    copy_structure: true
    generate_binding: true
    generate_wrapper: true
    pass_by: Value
    kind: Struct
  "QPainterPath::Element":
    copy_structure: true
    generate_binding: true
    generate_wrapper: true
    pass_by: Value
    kind: Struct
  "Qt::Initialization": { ignore: true } # Qt::Uninitialized constructor tag
  # A typedef of QGenericMatrix<3, 3, float>, a template bindgen can't
  # instantiate; drops Matrix4x4#normal_matrix and Quaternion#to_rotation_matrix.
  QMatrix3x3: { ignore: true }
  "QGradient::QGradientData": { ignore: true } # Private union
  "QRegion::QRegionData": { ignore: true } # Private
  "QRegion::const_iterator": { ignore: true } # Use #rect_count and #bounding_rect
  "QRegion::const_reverse_iterator": { ignore: true }
  "QPicture::DataPtr": { ignore: true }
  "QPixmapCache::KeyData": { ignore: true } # Private
  # Text and fonts
  QTextFrameLayoutData: { ignore: true } # Private layout data of QTextFrame
  QTextDocumentPrivate: { ignore: true } # Private; drops a QTextFragment constructor
  QTextEngine: { ignore: true } # Private; drops TextLayout#engine
  # Events, devices and input
  QPointingDeviceUniqueId: # A qint64
    copy_structure: true
    generate_binding: true
    generate_wrapper: true
    pass_by: Value
    kind: Struct
  # The QXmlStream classes return QStringRef (ignored above) through this
  # wrapper of it; ext/xml_helper.hpp returns the strings instead.
  QXmlStreamStringRef: { ignore: true }
  QJsonValuePtr: { ignore: true } # Fake pointer classes of the JSON iterators
  QJsonValueRefPtr: { ignore: true }
  "QJsonObject::const_iterator": { ignore: true } # Use #keys and #value
  "QJsonArray::iterator": { ignore: true } # Use #at and #size
  "QJsonArray::const_iterator": { ignore: true }
  "std::initializer_list<QPair<QString, QJsonValue>>": { ignore: true }
  "std::initializer_list<QJsonValue>": { ignore: true }
  QBitRef: { ignore: true } # Returned by the non-const operator[]; use #set_bit
  "QByteArray::Data": { ignore: true } # QBitArray#data_ptr, a typedef of QByteArray::DataPtr
  "QByteArray::DataPtr": { ignore: true }
  "QBitArray::DataPtr": { ignore: true }
  # QDataStream's friend operators name these, which have no mapping.
  qfloat16: { ignore: true }
  QFunctionPointer: { ignore: true } # QLibrary#resolve
  "QLoggingCategory::CategoryFilter": { ignore: true } # C function pointer
  "QLoggingCategory::AtomicBools": { ignore: true } # Private
  # A non-copyable bare struct with a C array; drops the stateful conversions
  # of QTextCodec, which TextCodec#to_unicode and #from_unicode don't need.
  "QTextCodec::ConverterState": { ignore: true }
  # Template members, which the parser doesn't report: their instantiations
  # are declared, and the generated C++ instantiates them.
  QMutex: &try_lock_for # try_lock_for takes any std::chrono::duration
    declare_methods:
      - "bool try_lock_for(std::chrono::milliseconds duration)"
  QRecursiveMutex: *try_lock_for
  QTextDecoder:
    ignore_methods:
      # Writes the string through the pointer, like the overload returning
      # it, which would take the same Crystal arguments (SPEC.md §2.2.5).
      - "toUnicode(QString *, const char *, int)"
  # These keep the pointer beyond the call, which bindgen can't tell from an
  # out argument it would return the value of.
  QTextStream:
    ignore_methods:
      - setString
  QBuffer:
    ignore_methods:
      - setBuffer
  # Meta-objects and CBOR
  # The moc-generated tables of QMetaObject's public `d` (an anonymous struct
  # in Qt 5) and the function pointers QMetaType registers types with.
  "QMetaObject::SuperData": { ignore: true }
  "void (QObject *, QMetaObject::Call, int, void **)": { ignore: true } # StaticMetacallFunction
  "void (QDataStream &, const void *)": { ignore: true } # QMetaType::SaveOperator
  "void (QDataStream &, void *)": { ignore: true } # QMetaType::LoadOperator
  "void (int, void *)": { ignore: true } # QMetaType::Destructor
  "void *(int, void *, const void *)": { ignore: true } # QMetaType::Constructor
  # Enum classes without enumerators, which a Crystal enum can't be: a tag
  # number and a negative integer's absolute value, exchanged as UInt64.
  QCborTag:
    cpp_type: quint64
    binding_type: UInt64
    crystal_type: UInt64
    builtin: true
    to_cpp: "QCborTag(%)"
    from_cpp: "quint64(%)"
    kind: Struct
    pass_by: Value
    generate_binding: false
    generate_wrapper: false
  QCborNegativeInteger:
    cpp_type: quint64
    binding_type: UInt64
    crystal_type: UInt64
    builtin: true
    to_cpp: "QCborNegativeInteger(%)"
    from_cpp: "quint64(%)"
    kind: Struct
    pass_by: Value
    generate_binding: false
    generate_wrapper: false
  # The invoke overloads take QGenericArgument/QGenericReturnArgument, type
  # name and void pointer pairs Crystal can't fill; the typed ones are
  # templates.  MetaObject.invoke_method(object, name) of
  # ext/meta_helper.hpp invokes a method without arguments.
  QMetaObject:
    ignore_methods:
      - invokeMethod
  QMetaMethod:
    ignore_methods:
      - invoke
      - invokeOnGadget
  "QMetaMethod::Data": { ignore: true }
  QGenericArgument: { ignore: true } # Drops the MetaObject#new_instance overloads taking arguments
  QGenericReturnArgument: { ignore: true }
  # The pairs of references the map iterators dereference to aren't default
  # constructible, which the pair container wrapper needs; use
  # CborMapIterator#key and #value.
  "QPair<const QCborValueRef, QCborValueRef>": { ignore: true }
  "QPair<const QCborValueRef, const QCborValueRef>": { ignore: true }
  "QCborMap::key_value_iterator": { ignore: true } # Use #keys and #value
  "QCborMap::const_key_value_iterator": { ignore: true }
  "QCborArray::Iterator": { ignore: true } # Use #at and #size
  "QCborArray::ConstIterator": { ignore: true }
  "QCborArray::iterator": { ignore: true }
  "QCborArray::const_iterator": { ignore: true }
  # Threads and IPC.  Qt threads must not call into Crystal (see the README),
  # so QThread and QRunnable get no C++ subclass: a Crystal override of `run`
  # is never called from the thread.
  QThread: { sub_class: false }
  QRunnable: { sub_class: false }
  # Remaining models, styles and providers
  "QIconEngine::AvailableSizesArgument": { ignore: true }
  <<+: keep_alive.yml # Deep merge: adds `keep_alive` to classes listed above
  <<+: methods.yml # Deep merge: adds `rename` and `nilable` to classes listed above
