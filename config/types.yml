types: # Type rewrite rules
  QString: # Convert QString instances using that:
    converter: Qt::Converter::QString
    crystal_type: String
    cpp_type: CrystalString
    binding_type: CrystalString
    to_cpp: "QString::fromUtf8(%.ptr, %.size)"
    from_cpp: "qstring_to_crystal(%)"
    kind: Struct
    builtin: true
    pass_by: Value
    wrapper_pass_by: Value
  QByteArray: # Map as Bytes, exchanged as a {pointer, size} pair like QString
    converter: Qt::Converter::QByteArray
    crystal_type: Bytes
    cpp_type: CrystalString
    binding_type: CrystalString
    to_cpp: "QByteArray(%.ptr, %.size)"
    from_cpp: "qbytearray_to_crystal(%)"
    kind: Struct
    builtin: true
    pass_by: Value
    wrapper_pass_by: Value
  QChar: # Map as Crystal Char
    cpp_type: int32_t
    binding_type: Int32
    builtin: true
    crystal_type: Char
    to_cpp: "QChar(%)"
    from_cpp: "static_cast<int32_t>(%.unicode())"
    to_crystal: "(%.chr)"
    from_crystal: "(%.ord)"
    kind: Struct
    pass_by: Value
  QVariant:
    crystal_type: Variant
    binding_type: CrystalVariant
    cpp_type: CrystalVariant
    from_crystal: "(%.to_unsafe)"
    to_crystal: "Qt::Variant.new(%)"
    from_cpp: "qvariant_to_crystal(%)"
    to_cpp: "crystal_to_qvariant(%)"
    kind: Struct
    builtin: true
    pass_by: Value
    wrapper_pass_by: Value
    generate_wrapper: false
    generate_binding: false
  QVariant::DataPtr: { ignore: true }
  "QUrlQuery::DataPtr": { ignore: true } # A QSharedDataPointer
  "QMetaObject::Connection":
    crystal_type: SignalConnection
    cpp_type: "QMetaObject::Connection"
    binding_type: QMetaObjectConnection
  QSessionManager:
    pass_by: Reference
    from_cpp: "(%)"
  QPoint:
    copy_structure: true
    binding_type: QPoint
    generate_binding: true
    generate_wrapper: true
    pass_by: Value
    kind: Struct
  QPointF:
    copy_structure: true
    binding_type: QPointF
    generate_binding: true
    generate_wrapper: true
    crystal_type: PointF
    pass_by: Value
    kind: Struct
  QSize:
    copy_structure: true
    binding_type: QSize
    generate_binding: true
    generate_wrapper: true
    crystal_type: Size
    pass_by: Value
    kind: Struct
    ignore_methods:
      - toCGSize
  QSizeF:
    copy_structure: true
    binding_type: QSizeF
    generate_binding: true
    generate_wrapper: true
    crystal_type: SizeF
    pass_by: Value
    kind: Struct
  QLine:
    copy_structure: true
    binding_type: QLine
    generate_binding: true
    generate_wrapper: true
    crystal_type: Line
    pass_by: Value
    kind: Struct
  QLineF:
    copy_structure: true
    binding_type: QLineF
    generate_binding: true
    generate_wrapper: true
    crystal_type: LineF
    pass_by: Value
    kind: Struct
  QRect:
    copy_structure: true
    binding_type: QRect
    generate_binding: true
    generate_wrapper: true
    crystal_type: Rect
    pass_by: Value
    kind: Struct
  QRectF:
    copy_structure: true
    binding_type: QRectF
    generate_binding: true
    generate_wrapper: true
    crystal_type: RectF
    pass_by: Value
    kind: Struct
  "QPainter::PixmapFragment":
    ignore: true
    # copy_structure: true
    # binding_type: QPainterPixmapFragment
    # generate_binding: false
    # generate_wrapper: false
    # crystal_type: PainterPixmapFragment
    # pass_by: Pointer
  "QAbstractEventDispatcher::TimerInfo":
    binding_type: EventDispatcherTimerInfo
    generate_binding: false
    generate_wrapper: false
    copy_structure: true
    pass_by: Value
    kind: Struct

  "QUrl::FormattingOptions":
    crystal_type: Url::FormattingOptions
    binding_type: Url::FormattingOptions
    kind: Enum
    builtin: true # We provide this type

  # Don't sub-class these
  QImage: { sub_class: false }
  QPixmap: { sub_class: false }
  QIcon: { sub_class: false }

  # Typedefs
  QRgb: { alias_for: "unsigned int" }
  "QRandomGenerator::result_type": { alias_for: "unsigned int" } # quint32
  "QRandomGenerator64::result_type": { alias_for: "unsigned long long" } # quint64
  WId: { alias_for: "unsigned int" }
  QStringList: { alias_for: "QList<QString>" } # A subclass of it, convertible both ways
  # bindgen looks through a typedef of a container instantiation, also one
  # taken as a `const T &` argument (QAbstractItemModel#changePersistentIndexList),
  # but not yet in the argument of a virtual method, which the override class
  # passes to Crystal as an opaque pointer: `mime_data(indexes :
  # Binding::QModelIndexList*)` instead of `Enumerable(ModelIndex)`.
  QModelIndexList: { alias_for: "QList<QModelIndex>" } # QAbstractItemModel#mimeData

  # The methods of `QList<QString>` (wrapped as `Qt::StringList`, see
  # `config/classes.yml`) use these: C++ iterators have no use in Crystal, and
  # `QVector<QString>` (of `toVector`) isn't wrapped.
  "QList<QString>::iterator": { ignore: true }
  "QList<QString>::const_iterator": { ignore: true }
  "QList<QString>::reverse_iterator": { ignore: true }
  "QList<QString>::const_reverse_iterator": { ignore: true }
  "QVector<QString>": { ignore: true }
  "QList<QString>":
    ignore_methods:
      - "operator[]" # Unchecked in Qt; `Indexable#[]` raises on a bad index
  # Qt's string views and regular expressions aren't wrapped: their overloads
  # would take opaque pointers nobody can build.  The view ones all have a
  # QString twin.
  QStringView: { ignore: true }
  QStringRef: { ignore: true }
  QLatin1String: { ignore: true }
  QRegExp: { ignore: true } # QRegularExpression is wrapped instead

  # Structures with QVariant: Ignore for now.
  "QInputMethodEvent::Attribute": { ignore: true }
  "QList<QInputMethodEvent::Attribute>": { ignore: true }

  "QList<QTextEdit::ExtraSelection>": { ignore: true }
  # Bare structs of QPalette, QRectF and a QVector of {QTextCursor,
  # QTextCharFormat}, which drops QAbstractTextDocumentLayout#draw and
  # QPlainTextEdit#get_paint_context.
  "QAbstractTextDocumentLayout::PaintContext": { ignore: true }
  # ...so `draw`, a pure virtual, isn't wrapped, and a subclass from Crystal
  # would stay abstract in C++: use QPlainTextDocumentLayout.
  QAbstractTextDocumentLayout: { sub_class: false }
  "QAbstractTextDocumentLayout::Selection": { ignore: true }
  "QVector<QAbstractTextDocumentLayout::Selection>": { ignore: true }
  # QTextLayout isn't bound; drops QTextBlock#text_formats.
  "QTextLayout::FormatRange": { ignore: true }
  "QVector<QTextLayout::FormatRange>": { ignore: true }
  "QTextBlock::iterator": { ignore: true } # Over QTextFragment, which isn't bound
  "QList<QTextOption::Tab>": { ignore: true }
  "QTextOption::Tab": { ignore: true }
  "QFormLayout::TakeRowResult": { ignore: true }

  # No support for associative containers yet
  "QMap<int, QVariant>": { ignore: true }
  "QMap<QDate, QTextCharFormat>": { ignore: true } # Use CalendarWidget#date_text_format(date)
  "QHash<int, QByteArray>": { ignore: true }

  # Ignore private data structures
  QObjectPrivate: { ignore: true }
  QKeySequencePrivate: { ignore: true }
  QUrlPrivate: { ignore: true }
  QImageData: { ignore: true }
  QIconPrivate: { ignore: true }
  "QPixmap::DataPtr": { ignore: true }
  "QBrush::DataPtr": { ignore: true }
  QPenPrivate: { ignore: true }
  QFileInfoPrivate: { ignore: true }
  QMimeTypePrivate: { ignore: true }

  # QByteArray maps to Bytes; QList<QByteArray> is instantiated in
  # containers.yml, QSet has no mapping yet.
  "QSet<QByteArray>": { ignore: true }

  # Ignore pure template types
  "QList<T>": { ignore: true }
  "Func1": { ignore: true } # Fake types used in QObject::connect().
  "Func2": { ignore: true }
  "QtPrivate::FunctionPointer<Func1>::Object": { ignore: true }
  "QtPrivate::FunctionPointer<Func2>::Object": { ignore: true }
  "T": { ignore: true }
  "void ()": { ignore: true }
  "void (void *)": { ignore: true }
  # The QTextStream manipulators (Qt::endl etc.) are C function pointers,
  # which bindgen cannot express; QTextStreamManipulator (qSetFieldWidth etc.)
  # only wraps calls to the setters QTextStream has anyway.
  QTextStreamFunction: { ignore: true }
  "QTextStream &(QTextStream &)": { ignore: true }
  QTextStreamManipulator: { ignore: true }
  # QEasingCurve's custom easing function is a C function pointer; the
  # QVariantAnimation interpolators are too, and go through registerInterpolator.
  "QEasingCurve::EasingFunction": { ignore: true }
  "qreal (qreal)": { ignore: true }
  "std::__1::function<void (const QString &, const QByteArray &)>":
    ignore: true
  "std::function<void (const QString &, const QByteArray &)>":
    ignore: true
  "std::chrono::milliseconds":
    cpp_type: int64_t
    binding_type: Int64
    crystal_type: "::Time::Span" # Qt::Time shadows Time inside module Qt
    generate_binding: false
    generate_wrapper: false
    pass_by: Value
    builtin: true
    to_cpp: "std::chrono::milliseconds(%)"
    from_cpp: "(%.count())"
    converter: Qt::Converter::TimeSpan
  "std::chrono::nanoseconds": # QDeadlineTimer#remainingTimeAsDuration
    cpp_type: int64_t
    binding_type: Int64
    crystal_type: "::Time::Span"
    generate_binding: false
    generate_wrapper: false
    pass_by: Value
    builtin: true
    to_cpp: "std::chrono::nanoseconds(%)"
    from_cpp: "(%.count())"
    converter: Qt::Converter::TimeSpanNanoseconds
  # The seeding from a std::seed_seq (QRandomGenerator) can't be expressed;
  # seed with an integer instead.  QRandomGenerator::System is the private
  # tag of the constructor behind QRandomGenerator::system().
  "std::seed_seq": { ignore: true }
  "QRandomGenerator::System": { ignore: true }
  CGRect: {ignore: true} # Apple types Qt exposes on macOS
  CGSize: {ignore: true}
  CGPoint: {ignore: true}
  CGImage: {ignore: true}
  NSMenu: {ignore: true}
  CFURLRef: {ignore: true}
  NSURL: {ignore: true}
  CFDateRef: {ignore: true} # QDateTime#toCFDate and friends
  __CFDate: {ignore: true}
  NSDate: {ignore: true}
  CFUUIDRef: {ignore: true} # QUuid#toCFUUID and friends
  __CFUUID: {ignore: true}
  NSUUID: {ignore: true}
  CFTimeZoneRef: {ignore: true} # QTimeZone#toCFTimeZone and friends
  __CFTimeZone: {ignore: true}
  NSTimeZone: {ignore: true}
  FILE: {ignore: true} # C stdio handle of QFile#open and QTextStream
  QListWidgetItem:
    ignore_methods:
      - "operator<"
  QHeaderView:
    ignore_methods:
      # bindgen wraps Qt's protected `initialize()` under that name, which
      # Crystal reserves for constructors, so the wrapper doesn't compile.
      - initialize
  QPolygon:
    ignore_methods: # Variadic, which can't be wrapped
      - setPoints
      - putPoints
  <<+: keep_alive.yml # Deep merge: adds `keep_alive` to classes listed above
