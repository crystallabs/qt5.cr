# Methods taking ownership of their arguments, which Qt then refers to from
# memory the GC doesn't scan.  Their wrappers pass these arguments to
# `BindgenHelper.keep_alive`, so the GC doesn't destroy objects Qt still uses.
# `Qt::BindgenHelper.release(object)` lets the GC collect one again.
#
# Deep-merged (`<<+:`) into `types:` after `deprecated.yml`, so classes listed
# in both keep their `ignore_methods` from there.
---
QLayout:
  keep_alive:
    "^addWidget$": true
    "^addItem$": true
    "^replaceWidget$": [1]
    "^setMenuBar$": true
QBoxLayout:
  keep_alive:
    "^(add|insert)(Widget|Layout|Item|SpacerItem)$": true
QGridLayout:
  keep_alive:
    "^add(Widget|Layout|Item)$": true
QFormLayout:
  keep_alive:
    "^(add|insert)Row$": true
    "^set(Widget|Layout|Item)$": true
    "^addItem$": true
QStackedLayout:
  keep_alive:
    "^(add|insert)Widget$": true
    "^addItem$": true
QWidget:
  keep_alive:
    "^setLayout$": true
QMainWindow:
  keep_alive:
    "^set(CentralWidget|MenuBar|MenuWidget|StatusBar)$": true
    "^addToolBar$": true
    "^insertToolBar$": [1]
    "^addDockWidget$": true
QStatusBar:
  keep_alive:
    "^(add|insert)(Permanent)?Widget$": true
QTabWidget:
  keep_alive:
    "^addTab$": [0]
    "^insertTab$": [1]
    "^setCornerWidget$": true
QScrollArea:
  keep_alive:
    "^setWidget$": true
QAbstractScrollArea:
  keep_alive:
    "^set(Viewport|CornerWidget|HorizontalScrollBar|VerticalScrollBar)$": true
    "^addScrollBarWidget$": true
QDockWidget:
  keep_alive:
    "^set(Widget|TitleBarWidget)$": true
QMenuBar:
  keep_alive:
    "^setCornerWidget$": true
QToolBar:
  keep_alive:
    "^addWidget$": true
    "^insertWidget$": [1]
QListWidget:
  keep_alive:
    "^(add|insert)Item$": true
    "^setItemWidget$": [1]
QTableWidget:
  keep_alive:
    "^set(Item|HorizontalHeaderItem|VerticalHeaderItem|CellWidget|ItemPrototype)$": true
QComboBox:
  keep_alive:
    "^set(LineEdit|View)$": true
QGraphicsScene:
  keep_alive:
    "^add(Item|Widget)$": [0]
QStandardItemModel:
  keep_alive:
    "^appendRow$": true
    "^set(Item|HorizontalHeaderItem|VerticalHeaderItem|ItemPrototype)$": true
