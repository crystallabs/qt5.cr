functions:
  "^qVersion$":
    destination: "::"
  # The QTextStreamManipulator makers: Qt.q_set_field_width(8).exec(stream)
  "^qSet(?:FieldWidth|PadChar|RealNumberPrecision)$":
    destination: "::"
  "^qt5cr_reset_numeric_locale":
    destination: "::"
  # The parser matches the whole name, see ext/validator_helper.hpp
  "^qt5cr_validator_validate$":
    destination: "::"
  "^qt5cr_validator_fixup$":
    destination: "::"
  "^qt5cr_xml_\\w+$": # See ext/xml_helper.hpp
    destination: "::"
  "^qt5cr_data_stream_\\w+$": # See ext/data_stream_helper.hpp
    destination: "::"
  "^qt5cr_invoke_method$": # See ext/meta_helper.hpp
    destination: "::"
  "^qt5cr_cbor_\\w+$": # See ext/cbor_helper.hpp
    destination: "::"
