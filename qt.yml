# This is the binding configuration for Qt5.
# Targeted version: Qt 5.9.1
# Main Page: https://www.qt.io/
# C++ Documentation: https://doc.qt.io/qt-5/index.html
#
# Please take note of Qts own license at:
#   https://doc.qt.io/qt-5/licensing.html
# Also see the license of THE BINDINGS in the LICENSE file.
#
# These bindings will, as configured, bind to Qt dynamically.

module: Qt

# Drop the API Qt deprecated after 5.15, overload by overload.  The API
# deprecated up to 5.15 is hidden by QT_DISABLE_DEPRECATED_BEFORE below.
ignore_deprecated: true
# Not yet: a method returning a pointer to a wrapped class would return nil
# for a null pointer, so its result is `T?` (Qt returns null routinely, like
# parentWidget() or currentItem()).  bindgen f0929c4 applies it to every
# pointer converted to Crystal: a signal with a pointer argument, like
# QStandardItemModel::itemChanged, declares its block as `Proc(StandardItem,
# Void)` but calls it with a `StandardItem?` ("no overload matches
# 'Proc(Qt::StandardItem, Nil)#call' with type (Qt::StandardItem | Nil)"), a
# Crystal override of a virtual taking a pointer must accept `T?`, and the
# elements of a container of pointers, like `QList<QStandardItem *>`, are
# `T?` ("unsafe_fetch must return Qt::StandardItem but it is returning
# (Qt::StandardItem | Nil)").  See `spec/qt/null_pointer_spec.cr`.
# nilable_results: true
if_os_is_darwin:
  library: "%/ext/binding_{BINDING_PLATFORM}.a -lstdc++ `pkg-config --libs Qt5Widgets` -lgccpp"
else:
  library: "%/ext/binding_{BINDING_PLATFORM}.a -lstdc++ -lQt5Core -lQt5Gui -lQt5Widgets -lgccpp"

<<: config/processors_and_generators.yml
<<: config/find_paths.yml
<<: config/classes.yml
<<: config/enums.yml
<<: config/macros.yml
<<: config/functions.yml
<<: config/containers.yml
<<: config/types.yml

parser: # Clang parser configuration
  if_TARGET_TRIPLE_is_: # TARGET_TRIPLE is empty.
    flags:
      - "-x"
      - "c++"
      - "-std=c++17"
      - "-fPIC"
      # Hide the APIs Qt deprecated up to 5.15.  Must match `ext/Makefile`.
      - "-DQT_DISABLE_DEPRECATED_BEFORE=0x050F00"
  else:
    flags:
      - "-x"
      - "c++"
      - "-stdlib=libc++"
      - "-std=c++17"
      - "-fPIC"
      - "-DQT_DISABLE_DEPRECATED_BEFORE=0x050F00"
      - "-target"
      - "{TARGET_TRIPLE}"
  files:
    - QtCore/QtCore
    - QtGui/QtGui
    - QtWidgets/QtWidgets
    - "locale_helper.hpp"
  includes:
    - "{QT_INCLUDE_DIR}/"
    - "{QT_INCLUDE_DIR}/QtCore/"
    - "{QT_INCLUDE_DIR}/QtGui/"
    - "{QT_INCLUDE_DIR}/QtWidgets/"
    - "{EXT_INCLUDES}"

